<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Ghost Attack Prototype</title>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	background: #050505;
	color: #ffffff;
	overflow: hidden;
	touch-action: none;
	font-family: monospace;
}

/* The "Play more games!" link sits in its own bar above the game instead of
   on top of it. The canvas is sized to the space below by fitCanvas(). */
#top-bar {
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	height: 36px;
	display: flex;
	align-items: center;
	padding: 0 12px;
	background-color: #111;
	z-index: 100;
}

#top-bar a {
	color: #fff;
	background: rgba(255, 255, 255, 0.12);
	padding: 4px 14px;
	border-radius: 4px;
	text-decoration: none;
	font-family: sans-serif;
	font-size: 14px;
}

#top-bar a:hover {
	background: rgba(255, 255, 255, 0.22);
}

#canvas {
	display: block;
	position: absolute;
	left: 0;
	top: 36px;
}

#canvas:focus {
	outline: none;
}

#start {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1rem;
	background: #050505;
	z-index: 2;
	text-align: center;
}

#start h1 {
	margin: 0;
	font-size: 1.25rem;
	letter-spacing: 0.1em;
}

#start button {
	border: 2px solid #ffffff;
	background: #111111;
	color: #ffffff;
	font: inherit;
	padding: 0.75rem 1.25rem;
	cursor: pointer;
}

#notice {
	min-height: 1.25rem;
	color: #cfcfcf;
}
		</style>
	</head>
	<body>
		<div id="top-bar"><a href="https://steelfishstudios.com/games">Play more games!</a></div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<div id="start">
			<h1>GHOST ATTACK</h1>
			<button id="start-button" type="button">CLICK TO START</button>
			<div id="notice">AUDIO STARTS AFTER INPUT</div>
		</div>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<script src="index.js"></script>
		<script>
// canvasResizePolicy 0 means Godot keeps whatever size the page gives the
// canvas, so it can fill the window below the top bar (policy 2 would always
// make it the full window, under the bar). Fullscreen hides the bar.
function fitCanvas() {
	const canvas = document.getElementById('canvas');
	const bar = document.getElementById('top-bar');
	const fullscreen = !!document.fullscreenElement;
	bar.style.display = fullscreen ? 'none' : '';
	const top = fullscreen ? 0 : bar.offsetHeight;
	const width = window.innerWidth;
	const height = Math.max(1, window.innerHeight - top);
	const ratio = window.devicePixelRatio || 1;
	canvas.style.top = `${top}px`;
	canvas.style.width = `${width}px`;
	canvas.style.height = `${height}px`;
	canvas.width = Math.floor(width * ratio);
	canvas.height = Math.floor(height * ratio);
}
window.addEventListener('resize', fitCanvas);
document.addEventListener('fullscreenchange', fitCanvas);
fitCanvas();

const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14220532,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const start = document.getElementById("start");
const startButton = document.getElementById("start-button");
const notice = document.getElementById("notice");
let started = false;

function startGame() {
	if (started) {
		return;
	}
	started = true;
	startButton.disabled = true;
	notice.textContent = "LOADING";
	engine.startGame().then(function () {
		start.remove();
	}).catch(function (error) {
		started = false;
		startButton.disabled = false;
		notice.textContent = "LOAD FAILED";
		console.error(error);
	});
}

startButton.addEventListener("click", startGame);
window.addEventListener("keydown", function (event) {
	if (!started && (event.code === "KeyZ" || event.code === "KeyJ" || event.code === "Enter" || event.code === "Space")) {
		event.preventDefault();
		startGame();
	}
});
		</script>
	</body>
</html>
