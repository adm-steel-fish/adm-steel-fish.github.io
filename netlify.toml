[build]
  publish = "."

[[headers]]
  for = "/games/**/Build/*.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"

[[headers]]
  for = "/games/**/Build/*.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"

[[headers]]
  for = "/games/**/Build/*.data.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

# Sources the Image CDN may pull from when flattening an animated article
# thumbnail into the static JPEG that X/Twitter cards require.
# See netlify/edge-functions/article-og.js. Add a host here if a new article's
# thumbnail comes from somewhere else, otherwise it falls back to the
# generic card at /images/og-default.jpg.
[images]
  remote_images = [
    "https://i\.ytimg\.com/.*",
    "https://img\.itch\.zone/.*",
    "https://encrypted-tbn\d\.gstatic\.com/.*",
    "https://images\.thedirect\.com/.*",
    "https://images\.lumacdn\.com/.*",
    "https://assets-global\.website-files\.com/.*",
    "https://i\.imgur\.com/.*",
    "https://media\d*\.giphy\.com/.*",
    "https://media\.tenor\.com/.*",
    "https://raw\.githubusercontent\.com/.*",
    "https://.*\.githubusercontent\.com/.*"
  ]
